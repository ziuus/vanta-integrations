[package]
name = "video_player"
version = "0.1.0"
edition = "2021"
description = "A custom WASM micro-extension for Vanta"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23.1"
extism-pdk = "1.4"
image = { version = "0.25.10", default-features = false, features = ["gif"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vanta-ext-sdk = { git = "https://github.com/ziuus/vanta-integrations.git" }
